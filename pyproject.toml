[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "proto"]
addopts = "-v --cov=src --cov-fail-under=80 --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "proto/*_pb2*.py",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W293"]
