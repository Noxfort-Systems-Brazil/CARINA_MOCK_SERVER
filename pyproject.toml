[project]
name = "carina-mock-server"
version = "1.1.0"
description = "CARINA Mock Server - High-Frequency Telemetry & Synapse Protocol Test Harness"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Gabriel Moraes", email = "gabriel.moraes@noxfortsystems.com" },
    { name = "Noxfort Systems" },
]
keywords = [
    "carina",
    "telemetry",
    "hft",
    "synapse-protocol",
    "grpc",
    "traffic-control",
    "sumo",
    "mock-server",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "grpcio",
    "grpcio-tools",
    "flet",
    "sumolib",
    "protobuf",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "proto"]
addopts = "-v --cov=src --cov-fail-under=80 --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "proto/*_pb2*.py",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W293"]
