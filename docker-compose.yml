services:
  carina-mock-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: carina-mock-server:latest
    container_name: carina_mock_server
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      - MOCK_SERVER_PORT=50051
      - MOCK_SERVER_HOST=0.0.0.0
      - MOCK_SERVER_NO_GUI=1
    volumes:
      - ./data/maps:/app/data/maps
